[package]
name = "scalpel"
version = "0.1.22"
edition = "2021"

[[bin]]
name = "scalpel"
path = "src/main.rs"

[dependencies]
serde = { version = "= 1.0.228", features = ["derive"] }
serde_json = "= 1.0.149"
toml = "= 0.8.23"
clap = { version = "= 4.5.57", features = ["derive"] }
anyhow = "= 1.0.101"
libc = "= 0.2.180"
tracing = "= 0.1.41"
tracing-subscriber = { version = "= 0.3.19", features = ["env-filter", "registry"] }
zip = { version = "= 8.1.0", default-features = false, features = ["deflate"] }

[profile.dev]
strip = false
debug = 2
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
